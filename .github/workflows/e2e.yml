# The live sandbox lane: the integration suites with RUN_E2E set, so the rows that need the real sandbox
# runtime and a real spawn run here, and MINITUI_REQUIRE_SANDBOX turns a sandbox that failed to start into
# a failure instead of a skip. vitest is called directly, never through turbo: turbo's test task passes
# only the variables it hashes and would drop both.
name: e2e
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINITUI_NODE_RUNTIME: node-22
      RUN_E2E: '1'
      MINITUI_REQUIRE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The sandbox runtime on Linux needs bubblewrap, socat and ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      # Ubuntu's AppArmor setting can forbid the unprivileged user namespaces bubblewrap needs; lift it
      # where the setting exists.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: pnpm exec vitest run --project integration-tests
