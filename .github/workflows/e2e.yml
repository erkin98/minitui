# The live sandbox lane: the integration suites with RUN_E2E set, so the rows that need the real sandbox
# runtime and a real spawn run here, and MINITUI_REQUIRE_SANDBOX turns a sandbox that failed to start into
# a failure instead of a skip. vitest is called directly, never through turbo: turbo's test task passes
# only the variables it hashes and would drop both.
name: Sandbox
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox:
    # Pinned, not ubuntu-latest: on ubuntu-26.04 bubblewrap starts but the sandbox's inner stage gets a
    # user namespace without capabilities even with the settings below, so the live rows cannot pass
    # there. 24.04 with those settings is the image sandbox-runtime's own CI runs on.
    name: Live sandbox (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MINITUI_NODE_RUNTIME: node-22
      RUN_E2E: '1'
      MINITUI_REQUIRE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The sandbox runtime on Linux needs bubblewrap, socat and ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      # Ubuntu's AppArmor setting can forbid the unprivileged user namespaces bubblewrap needs; lift it
      # where the setting exists, and allow unprivileged user namespaces, as sandbox-runtime's own CI does.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      # Says in the log whether both stages of the sandbox can start before the suites run: bubblewrap's
      # namespaces, then the nested user namespace the inner stage creates inside it. The live rows fail
      # on their own if either cannot; these lines say which one and under which AppArmor label.
      - run: |
          grep PRETTY_NAME /etc/os-release
          bwrap --version
          ls /etc/apparmor.d | grep -i -E 'bwrap|userns' || echo 'no bwrap or userns profile'
          bwrap --ro-bind / / --unshare-net true && echo 'bwrap namespaces: ok' || echo 'bwrap namespaces: FAILED'
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc cat /proc/self/attr/current || true
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc unshare --user --map-root-user --mount true \
            && echo 'nested user namespace: ok' || echo 'nested user namespace: FAILED'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: pnpm exec vitest run --project integration-tests
      # On a red run, the kernel's AppArmor lines name the profile that refused, if one did.
      - if: failure()
        run: sudo dmesg | grep -i apparmor | tail -n 20 || true
