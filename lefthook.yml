pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,mts,js}'
      run: pnpm exec eslint {staged_files}
    format:
      glob: '*.{ts,tsx,mts,js,json,md,yaml,yml}'
      run: pnpm exec prettier --check {staged_files}
    typecheck:
      # Through turbo (^build) so upstream package .d.ts resolve against the built
      # dist/ (tsup); a raw `tsc -b` fails cold now that tsc emits to dist-types/, not
      # dist/, so the exports-resolved dist/index.d.ts wouldn't exist pre-build (§Z92).
      run: pnpm run typecheck
    test-policy:
      # §Z55-G: fire on any staged .test.ts(x) AND any .ts(x) under a test/ or __tests__/
      # dir (helpers/fixtures/setup the script also scans), so pre-commit covers the same
      # set as the CI witness. Single-string brace glob with the alternatives inlined —
      # lefthook 1.8.2 predates the glob-array form (added upstream in 1.10.10).
      glob: '{*.test.ts,*.test.tsx,**/test/**/*.ts,**/test/**/*.tsx,**/__tests__/**/*.ts,**/__tests__/**/*.tsx}'
      run: pnpm run lint:test-policy
    syncpack:
      glob: '**/package.json'
      run: pnpm exec syncpack lint

pre-push:
  parallel: false
  commands:
    test:
      run: pnpm run test:all
    build:
      run: pnpm run build:all
